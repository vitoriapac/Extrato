<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Refinamento 1: Atelier Refined - O Livro em Traço Contínuo & 'E' -->
  <!-- Asa esquerda do livro: página aberta em traço esbelto e elegante (3.5px) -->
  <path d="M46 25 C34 22 22 24 14 27 V71 C22 68 34 66 46 69 Z" stroke="#1E3F35" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Linha interna de relevo da folha esquerda (profundidade de página sem peso excessivo) -->
  <path d="M22 37 C28 35 36 35 41 37" stroke="#1E3F35" stroke-width="2.5" stroke-linecap="round" />
  <path d="M22 47 C28 45 36 45 41 47" stroke="#2F5D4E" stroke-width="2.5" stroke-linecap="round" />
  <path d="M22 57 C28 55 34 55 38 57" stroke="#1E3F35" stroke-width="2.5" stroke-linecap="round" />

  <!-- Vinco/Lombada central esbelta que ancora as duas metades -->
  <line x1="49" y1="21" x2="49" y2="75" stroke="#1E3F35" stroke-width="2.5" stroke-linecap="round" />

  <!-- Coluna central do 'E' (lombada direita) -->
  <rect x="54" y="24" width="4.5" height="51" rx="2.25" fill="#1E3F35" />
  
  <!-- Três pautas contábeis do 'E' (linhas esbeltas de 4.5px, proporção áurea) -->
  <rect x="62.5" y="24" width="23.5" height="4.5" rx="2.25" fill="#1E3F35" />
  <rect x="62.5" y="47.25" width="17" height="4.5" rx="2.25" fill="#2F5D4E" />
  <rect x="62.5" y="70.5" width="13" height="4.5" rx="2.25" fill="#1E3F35" />

  <!-- Anel de Prontidão esbelto aberto no topo + ponto central âmbar -->
  <circle cx="83.5" cy="72.75" r="8.5" stroke="#E9953F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="42 10" transform="rotate(-90 83.5 72.75)" />
  <circle cx="83.5" cy="72.75" r="2" fill="#E9953F" />
</svg>