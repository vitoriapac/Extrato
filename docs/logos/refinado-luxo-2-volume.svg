<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Refinamento 2: Editorial Balance - Tomo Esculpido em Massa Equilibrada -->
  <!-- Página esquerda do livro: silhueta com recorte de respiro interno -->
  <path d="M43 25 C33 22 23 23 15 26.5 C14.5 26.7 14 27.2 14 27.8 V69.2 C14 69.8 14.5 70.3 15 70.5 C23 67 33 66 43 69 Z" fill="#1E3F35" />
  <!-- Respiro em espaço negativo dentro da página esquerda (harmoniza o peso com a direita) -->
  <path d="M40 31 C32 29 25 30 19 32.5 V63.5 C25 61 32 60 40 62.5 Z" fill="#F4F6F4" />
  <!-- Linha central de estudo na página esquerda -->
  <path d="M24 47 C29 45.5 33 45.5 37 46.5" stroke="#2F5D4E" stroke-width="2.5" stroke-linecap="round" />

  <!-- Espinha/Vinco central esbelta -->
  <line x1="46" y1="22" x2="46" y2="74" stroke="#1E3F35" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Coluna mestra do 'E' -->
  <rect x="50.5" y="24" width="4.8" height="50" rx="2.4" fill="#1E3F35" />
  
  <!-- Três pautas de extrato (5.0px de espessura, harmônicas e esbeltas) -->
  <rect x="59.5" y="24" width="26.5" height="4.8" rx="2.4" fill="#1E3F35" />
  <rect x="59.5" y="46.6" width="19" height="4.8" rx="2.4" fill="#2F5D4E" />
  <rect x="59.5" y="69.2" width="15" height="4.8" rx="2.4" fill="#1E3F35" />

  <!-- Anel de Prontidão esbelto aberto no topo + ponto focal âmbar -->
  <circle cx="83.5" cy="71.6" r="8.5" stroke="#E9953F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="42 10" transform="rotate(-90 83.5 71.6)" />
  <circle cx="83.5" cy="71.6" r="2" fill="#E9953F" />
</svg>