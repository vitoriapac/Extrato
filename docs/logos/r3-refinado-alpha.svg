<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- R3-Alpha: Editorial Precision (Traço Esbelto & Anel Aberto de Progresso) -->
  <!-- Lombada do caderno: curva suave e proporção esbelta -->
  <path d="M22 24 C16.5 24 14.5 28 14.5 33.5 V66.5 C14.5 72 16.5 76 22 76 H27 V24 H22 Z" fill="#1E3F35" />
  
  <!-- Coluna central do 'E' (5.2px de espessura, refinada) -->
  <rect x="32" y="24" width="5.2" height="52" rx="2.6" fill="#1E3F35" />
  
  <!-- Três pautas de extrato (5.2px de espessura, linhas mais longas e arejadas) -->
  <rect x="42.5" y="24" width="37.5" height="5.2" rx="2.6" fill="#1E3F35" />
  <rect x="42.5" y="47.4" width="26" height="5.2" rx="2.6" fill="#2F5D4E" />
  <rect x="42.5" y="70.8" width="22" height="5.2" rx="2.6" fill="#1E3F35" />
  
  <!-- Anel de Prontidão: arco de progresso aberto no topo, sutil e preciso -->
  <circle cx="74" cy="73.4" r="10.5" stroke="#E9953F" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="54 12" transform="rotate(-90 74 73.4)" />
  <!-- Ponto de foco central esbelto -->
  <circle cx="74" cy="73.4" r="2.4" fill="#E9953F" />
</svg>