<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- R3-Alpha Monograma em Livro Esculpido -->
  <!-- Lombada curva e folha aberta do livro à esquerda -->
  <path d="M26 23 C18 23 14 28 14 34 V66 C14 72 18 77 26 77 C28 77 30 76 30 74 V26 C30 24 28 23 26 23 Z" fill="#1E3F35" />
  <!-- Linha de folha interna do livro -->
  <path d="M21 30 C19 32 18 35 18 38 V62 C18 65 19 68 21 70" stroke="#F4F6F4" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Coluna central do 'E' (lombada interna) -->
  <rect x="36" y="24" width="5.2" height="52" rx="2.6" fill="#1E3F35" />
  
  <!-- Três pautas de estudo do 'E' -->
  <rect x="46" y="24" width="34" height="5.2" rx="2.6" fill="#1E3F35" />
  <rect x="46" y="47.4" width="24" height="5.2" rx="2.6" fill="#2F5D4E" />
  <rect x="46" y="70.8" width="20" height="5.2" rx="2.6" fill="#1E3F35" />

  <!-- Anel de Prontidão do R3-Alpha com microponto -->
  <circle cx="74" cy="73.4" r="10.5" stroke="#E9953F" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="54 12" transform="rotate(-90 74 73.4)" />
  <circle cx="74" cy="73.4" r="2.4" fill="#E9953F" />
</svg>