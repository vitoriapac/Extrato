<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- R3-Alpha Silhueta de Livro Aberto com Pautas do E -->
  <!-- Silhueta da página esquerda: contorno com curvas de página aberta -->
  <path d="M44 26 C32 23 20 25 14 28 V72 C20 69 32 67 44 70 Z" stroke="#1E3F35" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Linhas internas da página esquerda (linhas de leitura do livro) -->
  <line x1="22" y1="39" x2="36" y2="38" stroke="#1E3F35" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <line x1="22" y1="49" x2="36" y2="48" stroke="#1E3F35" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <line x1="22" y1="59" x2="32" y2="58" stroke="#1E3F35" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Vinco central (lombada) -->
  <line x1="48" y1="22" x2="48" y2="76" stroke="#1E3F35" stroke-width="2.5" stroke-linecap="round" />

  <!-- Página direita: Monograma 'E' refinado do R3-Alpha -->
  <rect x="53" y="24" width="5.2" height="52" rx="2.6" fill="#1E3F35" />
  <rect x="62" y="24" width="24" height="5.2" rx="2.6" fill="#1E3F35" />
  <rect x="62" y="47.4" width="18" height="5.2" rx="2.6" fill="#2F5D4E" />
  <rect x="62" y="70.8" width="14" height="5.2" rx="2.6" fill="#1E3F35" />

  <!-- Anel de Prontidão do R3-Alpha coroando a base da página direita -->
  <circle cx="83" cy="73.4" r="9" stroke="#E9953F" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="45 11" transform="rotate(-90 83 73.4)" />
  <circle cx="83" cy="73.4" r="2.2" fill="#E9953F" />
</svg>