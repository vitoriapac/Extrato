<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Junção 4 + 6: O Caderno em Matriz (The Matrix Codex) -->
  <!-- Asa esquerda do livro (3 blocos de página/heatmap) -->
  <rect x="18" y="26" width="13" height="20" rx="4" fill="#1E3F35" opacity="0.3" />
  <rect x="33" y="24" width="13" height="22" rx="4" fill="#1E3F35" />
  <rect x="18" y="50" width="13" height="24" rx="4" fill="#1E3F35" />
  <rect x="33" y="50" width="13" height="24" rx="4" fill="#2F5D4E" />

  <!-- Vinco central do livro / espinha -->
  <line x1="50" y1="20" x2="50" y2="78" stroke="#1E3F35" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" />

  <!-- Asa direita do livro (3 blocos de página + bloco âmbar de soma) -->
  <rect x="54" y="24" width="13" height="22" rx="4" fill="#1E3F35" />
  <rect x="54" y="50" width="13" height="24" rx="4" fill="#1E3F35" />
  <rect x="69" y="50" width="13" height="24" rx="4" fill="#1E3F35" opacity="0.4" />

  <!-- O bloco âmbar de destaque de hoje (canto superior direito com a soma) -->
  <rect x="69" y="26" width="13" height="20" rx="4" fill="#E9953F" />
  <path d="M75.5 31 V41 M70.5 36 H80.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>