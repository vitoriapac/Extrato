  <path d="M54 30 C66 30 78 34 78 34 V74 C78 74 66 70 54 70 Z" stroke="#1E3F35" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Blocos de consistência dentro da página esquerda (heatmap sutil) -->
  <rect x="27" y="42" width="7" height="8" rx="2" fill="#1E3F35" opacity="0.3" />
  <rect x="36" y="40" width="7" height="10" rx="2" fill="#1E3F35" />
  <rect x="27" y="54" width="7" height="10" rx="2" fill="#2F5D4E" />
  <rect x="36" y="54" width="7" height="10" rx="2" fill="#1E3F35" />

  <!-- Blocos de consistência dentro da página direita -->
  <rect x="57" y="40" width="7" height="10" rx="2" fill="#1E3F35" />
  <rect x="66" y="42" width="7" height="8" rx="2" fill="#1E3F35" opacity="0.3" />
  <rect x="57" y="54" width="7" height="10" rx="2" fill="#1E3F35" />
  <!-- Bloco dourado de soma dentro da página direita -->
