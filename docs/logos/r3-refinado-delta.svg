  <!-- Coluna mestra do E -->
  <rect x="32" y="24" width="5" height="52" rx="2" fill="#1E3F35" />
  
  <!-- Três pautas contábeis em proporção decrescente harmônica -->
  <rect x="42.5" y="24" width="38" height="5" rx="2" fill="#1E3F35" />
  <rect x="42.5" y="47.5" width="28" height="5" rx="2" fill="#2F5D4E" />
  <rect x="42.5" y="71" width="18" height="5" rx="2" fill="#1E3F35" />
  
  <!-- Selo de Prontidão: Anel concêntrico duplo ultrafino de alta precisão -->
  <circle cx="73" cy="73.5" r="11" stroke="#E9953F" stroke-width="2.6" />
  <circle cx="73" cy="73.5" r="5" stroke="#E9953F" stroke-width="1.6" opacity="0.6" />
