<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- R3-Alpha Livro Aberto (The Open Tome E) -->
  <!-- Asa esquerda: Página aberta curva de livro (curvatura superior e inferior inconfundível) -->
  <path d="M42 27 C32 24 22 25 14 28 C14 28 14 68 14 70 C22 67 32 66 42 69 Z" fill="#1E3F35" />
  
  <!-- Espinha/Vinco central sutil que separa as duas páginas -->
  <line x1="45" y1="23" x2="45" y2="76" stroke="#1E3F35" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />

  <!-- Coluna central da página direita (espinha do 'E') -->
  <rect x="49" y="24" width="5.2" height="52" rx="2.6" fill="#1E3F35" />
  
  <!-- Três pautas de extrato do R3-Alpha (formando o 'E' e as linhas de estudo da página direita) -->
  <rect x="58" y="24" width="28" height="5.2" rx="2.6" fill="#1E3F35" />
  <rect x="58" y="47.4" width="20" height="5.2" rx="2.6" fill="#2F5D4E" />
  <rect x="58" y="70.8" width="16" height="5.2" rx="2.6" fill="#1E3F35" />
  
  <!-- Anel de Prontidão do R3-Alpha: arco de 300° aberto no topo + ponto focal âmbar -->
  <circle cx="82" cy="73.4" r="9.5" stroke="#E9953F" stroke-width="3" stroke-linecap="round" stroke-dasharray="48 11" transform="rotate(-90 82 73.4)" />
  <circle cx="82" cy="73.4" r="2.2" fill="#E9953F" />
</svg>