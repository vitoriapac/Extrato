<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- R3-Gamma: Integrated Flow (A pauta inferior flui até o anel) -->
  <path d="M22 24 C16.5 24 14.5 28 14.5 33.5 V66.5 C14.5 72 16.5 76 22 76 H27.5 V24 H22 Z" fill="#1E3F35" />
  
  <rect x="33" y="24" width="5.2" height="52" rx="2.6" fill="#1E3F35" />
  
  <!-- Pautas superior e média -->
  <rect x="43.5" y="24" width="37.5" height="5.2" rx="2.6" fill="#1E3F35" />
  <rect x="43.5" y="47.4" width="26" height="5.2" rx="2.6" fill="#2F5D4E" />
  
  <!-- Linha inferior que se conecta e transiciona ao anel de prontidão âmbar -->
  <rect x="43.5" y="70.8" width="18" height="5.2" rx="2.6" fill="#1E3F35" />
  
  <!-- Anel de precisão em perfeita tangência com a pauta -->
  <circle cx="73" cy="73.4" r="9.5" stroke="#E9953F" stroke-width="3" stroke-linecap="round" />
  <!-- Diamante central de 4 pontas ou ponto sutil -->
  <circle cx="73" cy="73.4" r="2.8" fill="#E9953F" />
</svg>