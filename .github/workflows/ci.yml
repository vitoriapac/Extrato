name: CI
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      gate:
        description: Validation tier
        type: choice
        options: [fast, regression, full]
        default: full
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      gate: ${{ steps.detect.outputs.gate }}
      experience: ${{ steps.detect.outputs.experience }}
      shards: ${{ steps.detect.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select gate and inspect changed files
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_GATE: ${{ inputs.gate }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) gate=fast ;;
            push) gate=regression ;;
            release) gate=full ;;
            workflow_dispatch) gate="$REQUESTED_GATE" ;;
            *) gate=full ;;
          esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "release" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "experience=true" >> "$GITHUB_OUTPUT"
            if [[ "$gate" == "full" ]]; then
              echo 'shards=["1/4","2/4","3/4","4/4"]' >> "$GITHUB_OUTPUT"
            else
              echo 'shards=["1/1"]' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          node scripts/select-affected-tests.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --output test-impact.json > test-impact-selection.log
          impact_gate=$(node -e 'process.stdout.write(require("./test-impact.json").requiredGate)')
          echo "experience=$(node -e 'process.stdout.write(String(require("./test-impact.json").experienceRequired))')" >> "$GITHUB_OUTPUT"
          if [[ "$impact_gate" == "full" ]]; then
            gate=full
            echo "gate=full" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$gate" == "full" ]]; then
            echo 'shards=["1/4","2/4","3/4","4/4"]' >> "$GITHUB_OUTPUT"
          else
            echo 'shards=["1/1"]' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$impact_gate" == "docs" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Share impact plan with validation
        if: steps.detect.outputs.docs_only != 'true' && github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: test-impact
          path: test-impact.json
          if-no-files-found: error
          retention-days: 14
  validation:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.changes.outputs.shards || '["1/1"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only Markdown changed; application checks are unnecessary."
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.docs_only != 'true'
      - name: Static type check (JSDoc/tsc)
        if: needs.changes.outputs.docs_only != 'true' && (matrix.shard == '1/1' || matrix.shard == '1/4')
        run: npm run check:types
      - name: Cache Playwright Chromium
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium browser binary
        if: needs.changes.outputs.docs_only != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Download impact plan
        if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: test-impact
          path: .test-gates
      - name: Run selected validation gate
        if: needs.changes.outputs.docs_only != 'true'
        env:
          TEST_GATE: ${{ needs.changes.outputs.gate }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          SHARD_ARGS=(--shard "$TEST_SHARD")
          if [[ "$TEST_SHARD" != 1/* ]]; then
            SHARD_ARGS+=(--browser-only)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "pull_request" ]]; then
            npm run "test:$TEST_GATE" -- --plan .test-gates/test-impact.json "${SHARD_ARGS[@]}"
          else
            npm run "test:$TEST_GATE" -- "${SHARD_ARGS[@]}"
          fi
      - name: Upload gate timing
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ needs.changes.outputs.gate }}-${{ strategy.job-index }}
          path: |
            test-results/gate-summary.json
            .test-gates/history.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ needs.changes.outputs.gate }}-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  experience:
    needs: changes
    if: needs.changes.outputs.experience == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache-experience
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium browser binary
        if: steps.playwright-cache-experience.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run test:experience
      - name: Upload experience timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience
          path: |
            .test-gates/experience-summary.json
            .tmp-experience-gate/
            playwright-report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  visual-windows:
    needs: changes
    if: needs.changes.outputs.gate == 'full' && needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium (Windows)
        uses: actions/cache@v4
        id: playwright-cache-win
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium browser binary
        if: steps.playwright-cache-win.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run test:visual
      - name: Upload visual gate timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-windows
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
