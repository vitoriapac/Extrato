name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -d '' files < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          if (( ${#files[@]} == 0 )); then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in "${files[@]}"; do
            if [[ "$file" != *.md ]]; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
  checks:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: utc
            timezone: UTC
          - label: sao-paulo
            timezone: America/Sao_Paulo
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only Markdown changed; application checks are unnecessary."
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.docs_only != 'true'
      - run: npm run check:syntax
        if: needs.changes.outputs.docs_only != 'true' && matrix.label == 'utc'
      - run: npm run check
        if: needs.changes.outputs.docs_only != 'true'
  e2e:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: full-utc
            timezone: UTC
            suite: full
          - label: timezone-sao-paulo
            timezone: America/Sao_Paulo
            suite: timezone
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only Markdown changed; application checks are unnecessary."
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.docs_only != 'true'
      - run: npx playwright install --with-deps chromium
        if: needs.changes.outputs.docs_only != 'true'
      - run: npm run test:e2e
        if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'full'
      - run: npm run test:e2e:timezone
        if: needs.changes.outputs.docs_only != 'true' && matrix.suite == 'timezone'
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.label }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
