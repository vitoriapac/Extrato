name: Generate visual baselines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    env:
      # Match the CI browser gate, which runs screenshots in UTC.
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every spec with a screenshot assertion; non-visual failures must not block the upload.
      - run: npx playwright test $(grep -l toHaveScreenshot tests/e2e/*.spec.js) --update-snapshots
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: tests/e2e/*-snapshots/*-linux.png
          if-no-files-found: error
